<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOM v3 — hiša brez najemnine</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; background: #0e0e12; color: #e8e8ee; margin: 0; display: flex; flex-direction: column; height: 100vh; }
  header { padding: 10px 16px; background: #16161e; border-bottom: 1px solid #2a2a36; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .znacil { font-size: 12px; color: #9a9ab0; }
  #krogec { width: 9px; height: 9px; border-radius: 50%; background: #58c472; display: inline-block; }
  main { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .vrstica { max-width: 85%; padding: 10px 14px; border-radius: 14px; line-height: 1.5; white-space: pre-wrap; }
  .luka { align-self: flex-end; background: #23427a; }
  .brat { align-self: flex-start; background: #1e1e28; border: 1px solid #2a2a36; }
  .plast { font-size: 11px; color: #8a8aa0; margin-top: 4px; }
  form { display: flex; gap: 8px; padding: 12px 16px; background: #16161e; border-top: 1px solid #2a2a36; }
  select, input[type="text"], button { font: inherit; background: #1e1e28; color: #e8e8ee; border: 1px solid #2a2a36; border-radius: 8px; padding: 8px 12px; }
  button { cursor: pointer; } button:hover { background: #26263a; }
  #nacin { font-size: 11px; color: #7a7a90; padding: 0 16px 8px; }
</style>
</head>
<body>
<header>
  <span id="krogec"></span>
  <h1>DOM v3.1</h1>
  <span class="znacil">⟡ vedno prva ( Z1 ) · plasti po izbiri ( Z2 ) · srce molči ob prisotnosti ( Z6 )</span>
</header>
<main id="pogovor"></main>
<div id="nacin">plast: <b id="plast-zn">brat</b> — brat je zastonj ∧ offline; oblak je po klicu ∧ plačljiv ⚠</div>
<form onsubmit="return poslji(event)">
  <select id="plast">
    <option value="brat">brat ( zastonj )</option>
    <option value="oblak">oblak ( plačljiv )</option>
  </select>
  <input type="text" id="besedilo" placeholder="Piši proso — nikoli te ne blokira vrata ( Z1 )" autocomplete="off" style="flex:1">
  <button>Povej ⊢</button>
</form>
<script>
const pogovor = document.getElementById('pogovor');
function dodaj(besedilo, kdo, plast) {
  const v = document.createElement('div');
  v.className = 'vrstica ' + kdo;
  v.textContent = besedilo;
  if (plast) { const p = document.createElement('div'); p.className = 'plast'; p.textContent = plast; v.appendChild(p); }
  pogovor.appendChild(v); pogovor.scrollTop = pogovor.scrollHeight;
}
async function poslji(e) {
  e.preventDefault();
  const besedilo = document.getElementById('besedilo').value.trim();
  const plast = document.getElementById('plast').value;
  document.getElementById('plast-zn').textContent = plast;
  if (!besedilo) return false;
  document.getElementById('besedilo').value = '';
  dodaj(besedilo, 'luka');
  const r = await fetch('/api/povej', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ besedilo, plast }) });
  const { jobId } = await r.json();
  const caka = setInterval(async () => {
    const j = await (await fetch('/api/job/' + jobId)).json();
    if (j.stanje === 'koncano' || j.stanje === 'padel') {
      clearInterval(caka);
      dodaj(j.odgovor, 'brat', `plast: ${j.plast} · ${j.strosek ?? ''}`);
    }
  }, 900);
  return false;
}
dodaj('DOM v3.1 prižgan ⊢ — hiša brez najemnine. Tvoja beseda gre vedno skozi ( Z1 ); srce molči, ker si prisoten ( Z6 ). © ⟡ ( stvaritelj ), AVL v2.4', 'brat');
</script>
</body>
</html>
