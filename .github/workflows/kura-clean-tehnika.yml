name: KURA CLEAN — tehnični kit REGISTER-PULZ (pulz 25. 11. 2026, čista osnova)
# TEHNIKA REGISTER-PULZ ⊙ po ⟨PADC-⟨merge⟩-REF〉 ( zagon na refs/pull/N/merge je potisnil opeko ⟨merge⟩ commita v zgodovino veje
# ⇒ CI vseh_delavcev = action_required ) gradi ČISTO vejo : osnova ⟨main⟩ + 1 komit z že izmerjenim registrom.
# ⟨ne brisati⟩ — stara veja ostaja; ⟨ne zlije⟩; new PR nosi izmero.
on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: kura-clean-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: izmera pri viru ∧ gradnja čiste veje ∧ ⟨PR⟩
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          F=organi/stroj/REZ-REGISTER.md
          git checkout -B tehnika-eof-clean "$BASE_SHA"
          git checkout "$HEAD_SHA" -- "$F"
          git config user.name "atmavictu-tehnika"
          git config user.email "lukapin5@users.noreply.github.com"
          git add -A
          git commit -m "TEHNIKA REGISTER-PULZ : dopolnitev REZ-REGISTER ( 1 vrstica zahteve σ 6456 + 1 zapis rane ) — čista osnova ⟨main⟩ 91b7be34 ⊙ ⟨ne brisati⟩ ∧ ⟨ne zlije⟩ ⊙ pulz 25. 11. 2026"
          git push origin "HEAD:refs/heads/tehnika/register-pulz-clean-20261125"
          cat > /tmp/prbody.md <<'EOF'
          TEHNIKA REGISTER-PULZ (brez zahteve novega reza) ⊙ organ organi/stroj/REZ-REGISTER.md ⊙ čista veja tehnika/register-pulz-clean-20261125 ⊙ precedens ⟨PR⟩ #470/#2585/#2713

          IZMERA:
          - osnova ⟨main⟩ : 91b7be34 (⟨merge⟩ #2713) · telo 1.292.366 ⟨B⟩ · 988 vrstic ⊢
          - ta veja : 1 komit nad osnovo · telo 1.292.920 ⟨B⟩ · 990 vrstic · zaključna ⟨U+000A⟩ ⊢ pri viri
          - komiti ⟨main⟩ prebrani : zadnjih 100 ⊙ ⟨list_commits⟩ ⟨perPage⟩ 100 ⟨fields⟩ ⟨sha⟩ ∧ ⟨commit⟩
          - naslovi z vzorcem »rez«: 26 števil · manjkajoča vrstica ob prihodu: 1 (σ 6456)

          DOPOLNITEV (⟨ne brisati⟩ — samo dodajanje; ⟨ne zlije⟩):
          - zahteve : »- rez 6456 · ⟨merge⟩ 4460e6d · 2026-11-22 · PREŠTEVILČENJE ⟨PADC-DUPLIKAT-REZ⟩ … TIK 2026-11-22T20:00:44Z UTC ⇌ 21:00:44 CET Ljubljana …« (med σ 6434 ∧ σ 6463)
          - rane : »⟨merge⟩ brez vrstice (tuja seja) — dopolnil REGISTER-PULZ (TEHNIKA): 1 vrstica σ 6456 …« (pulz 25. 11. 2026)

          DOPUSTITEV : ⟨merge⟩ metoda merge ⊙ ukaz REGISTER-PULZ (TEHNIKA kit).
          EOF
          gh pr create --base main --head tehnika/register-pulz-clean-20261125 \
            --title "TEHNIKA REZ-REGISTER — dopolnitev 1 vrstice (pulz 25. 11. 2026, čista osnova)" \
            --body-file /tmp/prbody.md
