name: pet-vrat
on:
  push:
  pull_request:
jobs:
  pet-vrat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SODNIK-SEBE ( kanarek )
        run: bash organi/stroj/vrata/pet-vrat-lint.sh --sodba-sebe
      - name: VRATA-LINT ( kanon LICENSE.md)
        run: bash organi/stroj/vrata/pet-vrat-lint.sh LICENSE.md
      - name: VRATA-LINT ( nove vrstice diffa ; zgodovina spi )
        run: |
          MB=$(git merge-base origin/"$GITHUB_BASE_REF" HEAD 2>/dev/null || git merge-base origin/main HEAD)
          git diff --unified=0 "$MB" HEAD -- '*.md' ':(exclude)organi/stroj/vrata/*' ':(exclude)organi/*/ARHIV-PECATOV*' | grep -E '^\+' | grep -vE '^\+\+\+' | sed 's/^+//' > pvl-added.md || true
          bash organi/stroj/vrata/pet-vrat-lint.sh --diff-added pvl-added.md
