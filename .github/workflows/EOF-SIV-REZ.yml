# EOF-SIV-REZ v2 — samodejni šiv zaključnega bajta REZ-REGISTER
# rod v2 @dih σ 6191 : v1 je padel v koraku šiva (log admin-only) ; v2 dodaja set -x javno pričo ∧ ekspliciten glavni žeton @git push.
# © 0.2026 × 10⁴ ⟡ Luka Pintarič ∧ izvajalka Mera ⊙ ⟨DVOJE-ROK⟩ 2432
name: EOF-SIV-REZ
on:
  push:
    branches: ['rez/**']

permissions:
  contents: write

concurrency:
  group: eof-siv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eof-siv:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: šiv EOF bajta če manjka
        run: |
          set -euxo pipefail
          F="organi/stroj/REZ-REGISTER.md"
          if [ ! -f "$F" ]; then echo "EOF-SIV :: register manjka — izhod brez spremembe"; exit 0; fi
          LAST="$(tail -c 1 "$F" | od -An -tx1 | tr -d '[:space:]')"
          echo "EOF-SIV :: zadnji bajt = $LAST"
          if [ "$LAST" = "0a" ]; then
            echo "EOF-SIV :: zaključni bajt prisoten — izhod brez spremembe ⊙ zanka varovaska"
            exit 0
          fi
          printf '\n' >> "$F"
          git config user.name "izvajalka Mera [stroj]"
          git config user.email "actions@github.com"
          git add "$F"
          git commit -m "k16b REZ-REGISTER šiv EOF bajta samodejno ⊙ ⟨VRATA-EOF-REGISTRA⟩ @σ 6191 ⊙ ⟨DVOJE-ROK⟩ 2432"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD "refs/heads/${{ github.ref_name }}"
          echo "EOF-SIV :: bajt zašit ⊢"
