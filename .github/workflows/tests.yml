name: Tests
on:
  workflow_dispatch:
  # TEHNIKA (izmera 20. 10. 2026): pipefail dodan — prej izhodna koda korakov s | tee ni mogla pasti (koda cevi = tee = 0): instrument je bil slep na prave rane.
  # Izmera padcev: vsi teki padli v ~2 s; označbe se skrijejo v dnevniku teka (kanal obvestil jih ne nosi). Vzrok se pokaže sam po resetu kvote (~1. 11. 2026) ali v berbi dnevnika teka.
  # ⚠ zgornja vrstica je ugibanje, očerjeno 20. 10. 2026: mesečna kvota se ne poženi čez noč — val se je zacelil sam ~02:59 UTC 20. 10. (⟨PR⟩ #386 tests zelen), brez spremembe tega teka.
  # ⊢ izmera 20. 10. 2026: padec ~2 s = posel ni niti stekel (tests ∧ priča padla v istih sekundah, ⟨PR⟩ #383–#385); vzrok = odpoved platforme GitHub (Actions ∧ Pages ∧ Webhooks; githubstatus 19. 10. ~15:56 UTC). Brazgotina ostaja ⊙ 1349.
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install toolchain (typescript 5.9.3, @types/node 24.12.3 - lockfile in sync)
        run: npm ci
      - name: Typecheck (tsc --noEmit, strict)
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log
      - name: Build and run the test suite (model, repository, CLI, schema)
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
      - name: Izpis pada kot artefakt (Actions storage - 2 GB vključenih)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tests-padec-${{ github.run_id }}
          path: |
            typecheck.log
            test-output.log
          retention-days: 7
          if-no-files-found: ignore

  # ZAPRTA VRZELA (21. 10. 2026): web/ je ločen npm projekt, ki ga posel tests ni
  # nikoli pognal — sprememba samo v web/ je pomenila 0 CI. Ta posel zapre vrzel:
  # typecheck (strict) + vite build, brez novih odvisnosti izven web/package-lock.json.
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # playwright npm paket ob npm ci privzeto prenaša brskalnike (~300 MB) —
      # CI rabi samo typecheck + build, brskalnike pa ne (posel 21. 10. 2026
      # padel v timeout 10 min prav zaradi tega prenosa; priča: check run web,
      # run 39620715338).
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install web toolchain (react, vite - ločen lockfile)
        run: npm ci
        working-directory: web
      - name: Typecheck (web, tsc --noEmit, strict)
        run: npm run typecheck
        working-directory: web
      - name: Build (web, vite)
        run: npm run build
        working-directory: web


  # ZAPRTA VRZELA (23. 10. 2026, rez 2409): posel tests preverja module, posel web
  # gradi — a STREŽNIK se v ⟨CI⟩ ni nikoli prižigal: endpointi so bili priča le
  # prek testnih klicev v nodu, ne čez živo HTTP. Ta posel poenoti oba cilja ⟡
  # (»web build in živi endpointi … se poenotite«): zgradi web ∧ prižige živi API
  # na localhostu ∧ dokaže branja ∧ cikel vir → obdelava → knjiga čez HTTP ∧
  # živi preview zgrajenega spleta. /api/suggestions ∧ /api/semantic se v ⟨CI⟩
  # pričata kakor 502 (degradirata brez Ollame/Qdranta pri viru — strežnikova
  # milost ⊢ del telesa, ne padec) ∧ zato nista del žive preverbe.
  endpointi:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: 'npm'
      - name: Namesti orodje repa (API strežnik)
        run: npm ci
      - name: Zgradi API (tsc)
        run: npx tsc
      - name: Namesti orodje spleta (ločen lockfile)
        run: npm ci
        working-directory: web
      - name: Zgradi web (vite)
        run: npm run build
        working-directory: web
      - name: Prižigi živi API (localhost:4173) ∧ preveri endpointe čez HTTP
        shell: bash
        run: |
          set -o pipefail
          ROOT="$RUNNER_TEMP/workbench-zivi"
          mkdir -p "$ROOT"
          node build/src/workbenchApiServer.js "$ROOT" 4173 > api.log 2>&1 &
          echo $! > api.pid
          prizig=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4173/api/verify > /dev/null 2>&1; then prizig=1; break; fi
            sleep 1
          done
          if [ "$prizig" != "1" ]; then echo 'API se ni prižigal v 30 s'; cat api.log; exit 1; fi
          curl -sf http://localhost:4173/api/verify | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["isValid"] is True, d; print("verify (prazen koren): isValid ⊢")'
          for pot in manifest overview tree library concepts analysis/source; do
            koda=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:4173/api/$pot")
            echo "/api/$pot → $koda"
            if [ "$koda" != "200" ]; then echo "endpoint /api/$pot ni živ"; exit 1; fi
          done
          ID=$(curl -sf -X POST http://localhost:4173/api/incoming -H 'content-type: application/json' -d '{"title":"Živi dokaz","body":"Telo živega endpointa."}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          curl -sf -X POST "http://localhost:4173/api/incoming/$ID/start-processing" > /dev/null
          FRAG=$(curl -sf -X POST http://localhost:4173/api/fragments -H 'content-type: application/json' -d "{\"incomingTextId\":\"$ID\",\"body\":\"Prvi odstavek živega dokaza.\"}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          curl -sf -X POST http://localhost:4173/api/insertions -H 'content-type: application/json' -d "{\"fragmentId\":\"$FRAG\",\"targetChapterPath\":\"poglavje/zivi-dokaz.md\"}" > /dev/null
          curl -sf http://localhost:4173/api/verify | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["isValid"] is True, d; print("verify (po ciklu): isValid ⊢")'
          curl -sf http://localhost:4173/api/overview | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["incomingTotal"] == 1 and d["insertionTotal"] == 1, d; print("overview: vir 1, vstavitev 1 ⊢")'
          echo '⊢ živi endpointi: 6 branj + cikel vir → obdelava → knjiga + verify drži'
      - name: Poenotenje — prižigi živi web (vite preview, localhost:4174)
        working-directory: web
        shell: bash
        run: |
          set -o pipefail
          npx vite preview --port 4174 --strictPort > ../preview.log 2>&1 &
          echo $! > ../preview.pid
          prizig=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4174/ > /dev/null 2>&1; then prizig=1; break; fi
            sleep 1
          done
          if [ "$prizig" != "1" ]; then echo 'živi web se ni prižigal v 30 s'; cat ../preview.log; exit 1; fi
          koda=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4174/)
          echo "web / → $koda"
          if [ "$koda" != "200" ]; then echo 'živi web ni odgovoril 200'; exit 1; fi
          curl -sf http://localhost:4174/ | grep -q '<div id="root">' || { echo 'zgrajen HTML nima korena'; exit 1; }
          prox=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4174/api/verify)
          echo "web /api/verify (proxy, preview podeduje server.proxy) → $prox"
          echo '⊢ živi web: zgrajen ∧ postrežen ∧ koren na mestu'
      - name: Ugasni živi strežnika
        if: always()
        shell: bash
        run: |
          if [ -f api.pid ]; then kill "$(cat api.pid)" 2>/dev/null || true; fi
          if [ -f preview.pid ]; then kill "$(cat preview.pid)" 2>/dev/null || true; fi
