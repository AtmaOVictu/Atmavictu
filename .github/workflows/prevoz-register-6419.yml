name: PREVOZ-REGISTER-6419
on:
  push:
    branches: ['prevoz/kletka-znamenja-6413']
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: prevoz-register-6419
  cancel-in-progress: false
jobs:
  rep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prevoz/kletka-znamenja-6413
      - name: priprava
        id: priprava
        continue-on-error: true
        run: |
          git config user.name "izvajalka Mera ( prevoznik CI )"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          wc -c organi/stroj/REZ-REGISTER.md scratch/REZ-DODATEK-6419.md scratch/PREPISO-6419.txt
      - name: dodatek
        id: dodatek
        continue-on-error: true
        run: |
          ZVEZA="$(printf 'rez \xcf\x83 6419')"
          if grep -qF "$ZVEZA" organi/stroj/REZ-REGISTER.md; then echo "dodatek ze prisit" ; echo "ze=1" >> "$GITHUB_OUTPUT" ; exit 0 ; fi
          cat scratch/REZ-DODATEK-6419.md >> organi/stroj/REZ-REGISTER.md
          tail -c 2414 organi/stroj/REZ-REGISTER.md | cmp - scratch/REZ-DODATEK-6419.md
      - name: komit
        id: komit
        continue-on-error: true
        if: steps.dodatek.outcome == 'success'
        run: |
          git add organi/stroj/REZ-REGISTER.md
          git commit -F scratch/PREPISO-6419.txt
      - name: potisk
        id: potisk
        continue-on-error: true
        if: steps.dodatek.outcome == 'success'
        run: |
          git push origin HEAD:prevoz/kletka-znamenja-6413
      - name: porocilo
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const s = [
              'priprava=' + '${{ steps.priprava.outcome }}',
              'dodatek=' + '${{ steps.dodatek.outcome }}',
              'komit=' + '${{ steps.komit.outcome }}',
              'potisk=' + '${{ steps.potisk.outcome }}'
            ].join(' / ');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 2634,
              body: 'PREVOZ-REGISTER-6419 porocilo CI : ' + s + ' - ref=' + context.ref + ' - sha=' + context.sha
            });
