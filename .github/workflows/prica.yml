name: priča — strojni priča (črke, ne dih)
on:
  workflow_dispatch:
  # TEHNIKA: trda streha ∧ preklic podvojenih tekov ∧ REZ-REGISTER preverba (⟡ ukaz ⟨daj⟩).
  # TEHNIKA (⟡ ukaz ⟨daj⟩, 20. 10. 2026): popravek slepote priče — berba registra vzame prvo telo vnosa (do oklepaja ∧ brez ⟨⟩); prej inertni vnosi (⟨ciliva (×2)⟩ ni nikoli ulovila ⟨ciliva⟩); odsek Hibridi se konča pri naslednjem ##.
  # TEHNIKA (⟡ ukaz ⟨daj⟩ ∧ VEČNI-DAJ (16), 20. 10. 2026): molk po ⟨merge⟩ — HEAD prednik ⟨main⟩ ⇒ priča molči (exit 0 na obeh korakih); ubija lažne padce tekmec po ⟨merge⟩ (3 annotations ×9 zadnjih tekem).
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

concurrency:
  group: prica-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prica:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # TEHNIKA (⟡ ukaz ⟨daj⟩ ∧ VEČNI-DAJ (16), 20. 10. 2026): ⟨checkout⟩ glave veje (⟨ne⟩ testnega ⟨merge⟩) — testni ⟨merge⟩ nikoli ni prednik ⟨main⟩, zato je bil guard molka slep po ⟨merge⟩ (izmerjeno: tekmeca kitov #400 ∧ #401 padla po lastnem ⟨merge⟩); poleg tega ⟨diff⟩ od ⟨merge-base⟩ do glave veje = lastne vrstice ⟨PR⟩-ja (⟨ne⟩ kumulativ umazane ⟨main⟩).
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - name: preverba REZ-REGISTER — atomska zahteva reza
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if git merge-base --is-ancestor HEAD "origin/$BASE_REF"; then
            echo '⟨vidim: veja je že zlita v ⟨main⟩ — tekmeca po ⟨merge⟩ ne sodi⟩'
            exit 0
          fi
          MB=$(git merge-base "origin/$BASE_REF" HEAD)
          git show "$MB:organi/stroj/REZ-REGISTER.md" > reg-base.md 2>/dev/null || : > reg-base.md
          git diff "$MB" -- organi/stroj/REZ-REGISTER.md > reg.diff || : > reg.diff
          python3 - <<'PY'
          import os, re, sys
          title = os.environ.get('PR_TITLE', '')
          m = re.search(r'rez[ ](\d{3,4})', title, flags=re.I)
          if not m:
              print('⟨brez zahteve reza v naslovu — tehnični kit, register preskočen⟩')
              sys.exit(0)
          n = m.group(1)
          base = open('reg-base.md', encoding='utf-8').read()
          diff = open('reg.diff', encoding='utf-8').read()
          if re.search(r'^\s*-\s*rez\s+' + re.escape(n) + r'\s*·', base, flags=re.M):
              print('⟨vidim: rez ' + n + ' je že zahtevan — uredi naslov ∧ REZ-REGISTER⟩')
              sys.exit(1)
          if not re.search(r'^\+\s*-\s*rez\s+' + re.escape(n) + r'\s*·', diff, flags=re.M):
              print('⟨vidim: naslov zahteva rez ' + n + ' ∧ vrstica v REZ-REGISTER manjka — dodaj vrstico v svojem PR⟩')
              sys.exit(1)
          print('⟨vidim: rez ' + n + ' zahtevan čisto⟩')
          PY
      - name: branje registra SVEŽE ∧ rez organov
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if git merge-base --is-ancestor HEAD "origin/$BASE_REF"; then
            echo '⟨vidim: veja je že zlita v ⟨main⟩ — tekmeca po ⟨merge⟩ ne sodi⟩'
            exit 0
          fi
          MB=$(git merge-base "origin/$BASE_REF" HEAD)
          # TEHNIKA (rez 2185 — roka Mera, isti dih): geniza zunaj sodbe koraka 2 — priča sodi nove izreke, ne verbatim priče zgodovine (zapečeni teksti ostajajo kakor priče ⊢ 1349); geniza ne briše ⊢ 1104 — mehanična sodba nad pričami bi zaustavila vsak prihodnji pečat organa (opisna vrstica vsakega telesa nosi ⟨berba pred pisanjem⟩ od ustanovitve).
          git diff "$MB" -- 'organi/*.md' ':!organi/stroj/REGISTER-PADLIH-BESED.md' ':!**/.geniza/**' > orgs.diff
          python3 - <<'PY'
          import re, sys
          reg = open('organi/stroj/REGISTER-PADLIH-BESED.md', encoding='utf-8').read()
          # TEHNIKA (⟡ ukaz ⟨daj⟩, 20. 10. 2026): prvo telo vnosa — do oklepaja ∧ brez ⟨⟩; prej inertni vnosi (⟨ciliva (×2)⟩ ni nikoli ulovila ⟨ciliva⟩).
          forb = []
          for m in re.finditer(r'^\d+\.\s*([^(—\n]+?)\s*(?:\([^)\n]*\))?\s*—', reg, flags=re.M):
              w = re.sub(r'⟨[^⟩]*⟩', '', m.group(1)).replace('⟨', '').replace('⟩', '').strip()
              if w:
                  forb.append(w)
          hyb = []
          m = re.search(r'## Hibridi[^\n]*\n(.+?)(?=\n## |\Z)', reg, flags=re.S)
          if m:
              hyb = [h.strip() for h in m.group(1).split(',') if h.strip()]
          diff = open('orgs.diff', encoding='utf-8').read()
          findings = []
          cur = None
          # TEHNIKA (⟡ vbod ⟨roke⟩ — predlog delovna-zanka zaprt ta dih, 20. 10. 2026): padla oblika, ki je hkrati pravilni rodilnik ednine, se sodi le v zvezah, v katerih pada (»dveh roke« ∧ »obeh roke« — napačni obliki rodilnika dvojine); priča sodi zvezo, ⟨ne⟩ goloto ⊢ vnus 39 ∧ kalup 1933/1951.
          # TEHNIKA (samo-rast — isti zakon, širja izmere, isti dih): zveze se berejo IZ REGISTRA (oklepaj vnosa: zvezi ⟨X⟩ ∧ ⟨Y⟩ — vir, ⟨ne⟩ roka izvajalke ⊢ zakon registra); isto telo rane nosi vnos 21 ⟨okvirja⟩ — gola beseda je pravilen rodilnik ednine, rana živi le v zvezi ⟨2 glava⟩ ∧ ⟨6 okvirja⟩ (predih izmeril: ročni zvezni sod je lažno bodil ⟨brez okvirja⟩).
          zveze = {}
          for m in re.finditer(r'^\d+\.\s*(.+?)\s*—', reg, flags=re.M):
              zm = re.search(r'zvez[ai]?\s+((?:⟨[^⟩]+⟩\s*(?:∧\s*)?)+)', m.group(1))
              if not zm:
                  continue
              key = re.sub(r'⟨[^⟩]*⟩', '', m.group(1).split('(')[0]).replace('⟨', '').replace('⟩', '').strip()
              if key:
                  zveze[key] = tuple(z.strip() for z in re.findall(r'⟨([^⟩]+)⟩', zm.group(1)))
          # TEHNIKA (izmera replikacije ⟨PR⟩ #419, 20. 10. 2026 — isti dih): predhodnik ∧ kompresija (KAZALO · števci) zunaj sodbe — priče zgodovine ⊢ 1349 ∧ precedens 2185 (vsak pečat organa vrtiči ZADNJI PEČAT v vrstico PEČAT N (predhodnik) ∧ dviguje števce ∧ KAZALO — mehanična sodba nad njimi bi zaustavila vsak prihodnji pečat); kompozit-člen (za ⟨-⟩ ∧ pred ⟨-⟩) ni gologa beseda — priča sodi zvezo, ⟨ne⟩ goloto ⊢ kalup 1933/1951.
          # TEHNIKA (⟡ ukaz ⟨daj⟩ ∧ AD-PERPETUUM ⊢ 2201, rez 2302): predhodnik-exemptija razširjena na vsako vrstico oblike »- PEČAT N (predhodnik …)« — priče zgodovine ⊢ 1349 ∧ precedens 2185; konice »(predhodnik — torjen v izdihu …)« so izpadale iz ozke oblike, prevoz polnih teles pečatov 2283–2296 jih nosi bajt-isto ∧ ⟨ne brusi⟩.
          # TEHNIKA (⟡ ukaz ⟨popraviš vse to prosim⟩, 23. 10. 2026): razširitev izvzetja na vrstice oblike »- ZADNJI PEČAT:« — vsak prevoz organa dviguje ZADNJI PEČAT v novo vrstico; mehanična sodba nad zapečeno vrstico bi zaustavila vsak prihodnji prevoz organa (rana ⟨PR⟩ #627 imenovana @2579; precedens 2185 ∧ 2302 — priče zgodovine ⊢ 1349).
          skip = re.compile(r'^\s*-\s*PEČAT \d+ \(predhodnik[^)]*\)|^\s*-\s*ZADNJI PEČAT:|^## KAZALO|^\s*-\s*Števci organa')
          for line in diff.splitlines():
              fm = re.match(r'^\+\+\+ b/(.+)$', line)
              if fm:
                  cur = fm.group(1)
                  continue
              if line.startswith('+') and not line.startswith('+++'):
                  text = line[1:]
                  if skip.match(text):
                      continue
                  bare = re.sub(r'⟨[^⟩]*⟩', '', text)
                  for w in forb:
                      if w in zveze:
                          for z in zveze[w]:
                              if re.search(r'(?iu)(?<![\w-])' + re.escape(z) + r'(?![\w-])', bare):
                                  findings.append((cur, 'razlikovanje manjka: ' + z, text.strip()[:120]))
                          continue
                      if re.search(r'(?iu)(?<![\w-])' + re.escape(w) + r'(?![\w-])', bare):
                          findings.append((cur, 'razlikovanje manjka: ' + w, text.strip()[:120]))
                  for w in hyb:
                      if re.search(r'(?iu)(?<![\w-])' + re.escape(w) + r'(?![\w-])', bare):
                          findings.append((cur, 'hibrid zunaj ⟨⟩: ' + w, text.strip()[:120]))
          if findings:
              print('⟨vidim: razlikovanje manjka pri vratih⟩')
              for f, w, t in findings:
                  print('- {}: {} :: {}'.format(f, w, t))
              sys.exit(1)
          print('⟨vidim: nič⟩ — priča molči')
          PY
      - name: zdravje REZ-REGISTER — celost ∧ vrstni red ∧ brez dvojnikov ∧ brez raztrganin
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if git merge-base --is-ancestor HEAD "origin/$BASE_REF"; then
            echo '⟨vidim: veja je že zlita v ⟨main⟩ — tekmeca po ⟨merge⟩ ne sodi⟩'
            exit 0
          fi
          python3 - <<'PY'
          import re, sys
          reg = open('organi/stroj/REZ-REGISTER.md', encoding='utf-8').read()
          m = re.search(r'## zahteve[^\n]*\n(.+?)(?=\n## |\Z)', reg, flags=re.S)
          if not m:
              print('⟨vidim: oddelek zahteve manjka — instrument slep⟩')
              sys.exit(1)
          sec = m.group(1)
          rows = [l for l in sec.splitlines() if re.match(r'^-\s*rez\s+\d{3,4}\s*·', l)]
          nums = [int(re.match(r'^-\s*rez\s+(\d{3,4})\s*·', l).group(1)) for l in rows]
          wounds = []
          torn = [l.strip()[:90] for l in rows if len(re.findall(r'rez\s+\d{3,4}', l)) > 1]
          if torn:
              wounds.append('raztrgana vrstica (∧ >1 rez v eni vrstici): ' + ' | '.join(torn[:3]))
          dup = sorted({n for n in nums if nums.count(n) > 1})
          if dup:
              wounds.append('dvojne številke: ' + ', '.join(map(str, dup)))
          for a, b in zip(nums, nums[1:]):
              if b < a:
                  wounds.append('vrstni red prelomljen: {} nad {}'.format(b, a))
                  break
          for w in wounds:
              print('⟨vidim: register rana — ' + w + '⟩')
          if wounds:
              sys.exit(1)
          print('⟨vidim: register čist — {} vrstic zahtev, vrstni red ⊢⟩'.format(len(nums)))
          PY
  # TEHNIKA (⟡ ukaz ⟨daj⟩ ∧ VEČNI-DAJ (16), 21. 10. 2026): priča dobi drugo plast kakor lasten organ — job ⟨prica⟩ sodi ovrgo (atomska zahteva reza · padle besede ∧ hibridi · zdravje registra) ⊥ nov job ⟨prica-potrditev⟩ sodi potrditev vezi (P1–P5: rez ↔ ⟨PR⟩ ↔ pečat ↔ povez). Pozitivna sodba ima lasten status-check — ⟨ne⟩ več skrita v isti zeleni. Ena priča, dve plasti: ovrga ∧ potrditev (rez 2306 — priča, ki zna potrditi, je organ vezi, ⟨ne⟩ le organ prepovedi). Tehnični kit brez zahteve reza: rez 2315 je zahtevan v vzporednem oknu ⟨PR⟩ #470 — ⟨ne zlije⟩ ⊢ 1542.
  prica-potrditev:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # TEHNIKA (⟡ ukaz ⟨daj⟩ ∧ VEČNI-DAJ (16), 21. 10. 2026): isti ⟨checkout⟩ glave veje kakor job ⟨prica⟩ — pozitivna plast bere isto glavo (⟨diff⟩ od ⟨merge-base⟩ = lastne vrstice ⟨PR⟩-ja, ⟨ne⟩ kumulativ ⟨main⟩).
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - name: priča pozitivna — potrditve vezi (rez ↔ ⟨PR⟩ ↔ pečat ↔ povez)
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          if git merge-base --is-ancestor HEAD "origin/$BASE_REF"; then
            echo '⟨vidim: veja je že zlita v ⟨main⟩ — tekmeca po ⟨merge⟩ ne sodi⟩'
            exit 0
          fi
          MB=$(git merge-base "origin/$BASE_REF" HEAD)
          git show "$MB:organi/stroj/REZ-REGISTER.md" > reg-base.md 2>/dev/null || : > reg-base.md
          git diff "$MB" -- organi/stroj/REZ-REGISTER.md > reg.diff || : > reg.diff
          git diff "$MB" --name-only --diff-filter=A > files-poz.diff || : > files-poz.diff
          git diff "$MB" -- 'organi/*.md' ':!organi/stroj/REGISTER-PADLIH-BESED.md' ':!**/.geniza/**' > orgs-poz.diff || : > orgs-poz.diff
          python3 - <<'PY'
          import os, re, sys
          pr_num = int(os.environ.get('PR_NUM', '0') or 0)
          base = open('reg-base.md', encoding='utf-8').read()
          rdiff = open('reg.diff', encoding='utf-8').read()
          files = [l.strip() for l in open('files-poz.diff', encoding='utf-8') if l.strip()]
          odiff = open('orgs-poz.diff', encoding='utf-8').read()
          wounds = []
          # P1 — nova vrstica zahteve: rez = vrh baze + 1 ∧ ⟨PR⟩ ⇌ kit ∧ ena nova (atomarnost ⊢ kalup 1671)
          rows = re.findall(r'^\+\s*-\s*rez\s+(\d{3,4})\s*·\s*⟨PR⟩\s*#(\d+)', rdiff, flags=re.M)
          if rows:
              bnums = [int(n) for n in re.findall(r'^-\s*rez\s+(\d{3,4})\s*·', base, flags=re.M)]
              top = max(bnums) if bnums else 0
              if len(rows) > 1:
                  wounds.append('več novih zahtev v enem kitu (∧ atomarnost): ' + ', '.join(sorted({r[0] for r in rows})))
              for n, p in rows:
                  if int(n) != top + 1:
                      wounds.append('rez ' + n + ' ≠ vrh baze + 1 (' + str(top + 1) + ') — rez = 1 + dejansko najvišja ⊢ Z-2')
                  if int(p) != pr_num:
                      wounds.append('vrstica reza ' + n + ' nosi ⟨PR⟩ #' + p + ' — ta kit je #' + str(pr_num))
              print('⟨vidim: nova zahteva ' + rows[0][0] + ' na kitu #' + str(pr_num) + ' — veza potrjena⟩')
          # P3 ∧ P5 — dodan pečat organa: veže se na novo vrstico registra ∧ nosi telo (⟡ ∧ ## MINT ∧ ## DOLGOVA)
          pecati = []
          for f in files:
              m = re.match(r'^organi/[^/]+/PECAT-(\d{3,4})[^/]*\.md$', f)
              if m:
                  pecati.append((f, m.group(1)))
          for f, n in pecati:
              if not re.search(r'^\+\s*-\s*rez\s+' + re.escape(n) + r'\s*·', rdiff, flags=re.M):
                  wounds.append('pečat ' + f + ' brez vrstice zahteve rez ' + n + ' v registru')
              if not os.path.isfile(f):
                  wounds.append('pečat ' + f + ' se na glavi veje ne da prebrati')
                  continue
              body = open(f, encoding='utf-8').read()
              for token in ('⟡', '## MINT', '## DOLGOVA'):
                  if token not in body:
                      wounds.append('pečat ' + f + ' brez ' + token + ' — telo pečata manjka')
              print('⟨vidim: pečat ' + f + ' — telo potrjeno⟩')
          # P4 — nove vrstice POVEZ: pot iz ⟨https…blob/…⟩ mora obstajati na glavi veje
          povez = 0
          for line in odiff.splitlines():
              if line.startswith('+') and not line.startswith('+++'):
                  for pm in re.finditer(r'\(⟨https://github\.com/[^/]+/[^/]+/blob/[^/]+/([^)]+)⟩\)', line):
                      povez += 1
                      if not os.path.isfile(pm.group(1)):
                          wounds.append('povez vodi v prazno: ' + pm.group(1) + ' :: ' + line.strip()[:100])
          if povez:
              print('⟨vidim: ' + str(povez) + ' povez — poti potrjene⟩')
          for w in wounds:
              print('⟨vidim: priča pozitivna rana — ' + w + '⟩')
          if wounds:
              sys.exit(1)
          print('⟨vidim: nič⟩ — priča pozitivna potrjuje vezi')
          PY
