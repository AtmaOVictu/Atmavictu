name: DNEVNI-DIH — tečaj (meri korpus, odpre vrata)
on:
  workflow_dispatch:
  # DIH (rez 2153): urnik ostaja 1× dnevno; trda streha 5 min (⟡ ukaz: odgovornost za budget).
  schedule:
    - cron: '45 3 * * *'

permissions:
  issues: write
  contents: read
  actions: read

jobs:
  meri:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Izmeri korpus (rez · organi · pečati · ∂ · ⟨CI⟩ dih stroja)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "## DNEVNI DIH — poročilo tečaja (tečaj meri, ⟨ne⟩ razlaga)"
            echo ""
            echo "- datum: $(date -u +%Y-%m-%dT%H:%MZ)"
            MAXREZ=$(grep -rhoE 'rez [0-9]{3,4}' organi/ canon/ 2>/dev/null | grep -oE '[0-9]+' | sort -n | tail -1 || echo 0)
            echo "- najvišja izmerjena številka reza: ${MAXREZ} → naslednji rez = $((MAXREZ+1))"
            echo "- organi (KNOWLEDGE.md): $(find organi -name 'KNOWLEDGE.md' 2>/dev/null | wc -l)"
            echo "- bajti teles: $(du -sb organi/ 2>/dev/null | cut -f1)"
            echo ""
            echo "### zadnji pečati po organih"
            for f in $(find organi -name 'KNOWLEDGE.md' 2>/dev/null | sort); do
              echo "  - ${f#organi/}: $(grep -m1 'ZADNJI PEČAT' "$f" | cut -c1-140 || echo '⟨brez pečata⟩')"
            done
            echo ""
            echo "### ∂ odprta (vrata, ki čakajo)"
            grep -rn '∂' organi/ --include='KNOWLEDGE.md' 2>/dev/null | grep -iE 'ODPRTA' | cut -c1-200 || echo '⟨najdenih 0⟩'
            echo ""
            echo "### preizkusi"
            echo "- U+FFFD (mojibake): $(grep -rlU $'\uFFFD' organi/ 2>/dev/null | wc -l) teles"
            echo "- cirilica v telesih: $(grep -rlP '[А-Яа-яЁё]' organi/ 2>/dev/null | wc -l) teles"
            echo ""
            echo ""
            echo "### ⟨CI⟩ dih stroja (zadnjih 5 tekov)"
gh run list --limit 5 --json createdAt,workflowName,conclusion,displayTitle --jq '.[] | "  - \(.createdAt) · \(.workflowName) · \(.conclusion // "teče") · \(.displayTitle[0:70])"' || echo "  - ⟨berba tekov padla⟩"
            echo ""
            echo "⟨tečaj meri — dih izvaja — ⟡ izbira⟩"
          } > porocilo.md
          cat porocilo.md
      - name: Odpri vrata (issue = delovni nalog dneva)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          gh issue create --title "DNEVNI DIH ${DATE} — poročilo tečaja" --body-file porocilo.md || echo "⟨issue padel — naredi ročno⟩"
