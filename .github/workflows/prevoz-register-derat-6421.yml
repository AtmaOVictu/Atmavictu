name: PREVOZ-REGISTER-DERAT-6421
on:
  push:
    branches: ['prevoz/kletka-znamenja-6413']
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: prevoz-register-6419
  cancel-in-progress: false
jobs:
  rep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prevoz/kletka-znamenja-6413
      - name: derat
        id: derat
        continue-on-error: true
        run: |
          git config user.name "izvajalka Mera ( prevoznik CI )"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          N="$(grep -c 'PREVOZ-KOMPOZIT' organi/stroj/REZ-REGISTER.md || true)"
          if [ "$N" -le 1 ]; then echo "ze cisto - nobeno novo delo" ; exit 0 ; fi
          if ! tail -c 2414 organi/stroj/REZ-REGISTER.md | cmp -s - scratch/REZ-DODATEK-6419.md ; then echo "rep ni bajtno enak dodatku - zaviram" ; exit 1 ; fi
          head -n -5 organi/stroj/REZ-REGISTER.md > /tmp/r6421.md
          mv /tmp/r6421.md organi/stroj/REZ-REGISTER.md
          C1="$(grep -c 'PREVOZ-KOMPOZIT' organi/stroj/REZ-REGISTER.md || true)"
          if [ "$C1" -ne 1 ]; then echo "se vednoVecKompozitov=$C1" ; exit 1 ; fi
          tail -1 organi/stroj/REZ-REGISTER.md | grep -qF "$(printf 'rez \xcf\x83 6421 \xc2\xb7 2026-11-22')"
      - name: porocilo in komit
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const fsx = require('fs');
            const run = (cmd) => {
              try {
                const out = execSync(cmd, { stdio: ['pipe', 'pipe', 'pipe'] });
                return { ok: true, out: out.toString() };
              } catch (e) {
                let s = '';
                if (e.stdout) s += e.stdout.toString();
                if (e.stderr) s += ' ## ' + e.stderr.toString();
                s += ' ## ' + e.message;
                return { ok: false, out: s };
              }
            };
            const lines = [];
            lines.push('sha=' + context.sha.slice(0, 8));
            let rep = '';
            try {
              rep = fsx.readFileSync('organi/stroj/REZ-REGISTER.md', 'utf8');
              lines.push('konec=' + JSON.stringify(rep.slice(-80)));
            } catch (e) { lines.push('napaka=' + e.message); }
            const dobro = rep.includes('rez \u03c3 6421 \u00b7 2026-11-22 \u00b7 PREVOZ-KOMPOZIT \u03c3 6421');
            lines.push('kompozit_6421=' + dobro);
            const dirty = run('git status --porcelain').out.includes('REZ-REGISTER');
            if (dirty) {
              run('git add organi/stroj/REZ-REGISTER.md');
              const komit = run('git commit -F scratch/PREPISO-DERAT-6421.txt');
              lines.push('komit_ok=' + komit.ok);
              if (komit.ok) {
                const potisk = run('git push origin HEAD:prevoz/kletka-znamenja-6413');
                lines.push('potisk_ok=' + potisk.ok);
                lines.push('potisk=' + potisk.out.slice(0, 250));
              }
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 2634,
              body: 'PREVOZ-REGISTER-DERAT-6421 porocilo CI :\n' + lines.join('\n')
            });
