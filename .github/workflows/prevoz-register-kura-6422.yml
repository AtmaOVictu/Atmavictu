name: PREVOZ-REGISTER-KURA-6422
on:
  push:
    branches: ['prevoz/kletka-znamenja-6413']
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: prevoz-register-kura-6422
  cancel-in-progress: false
jobs:
  rep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prevoz/kletka-znamenja-6413
      - name: kura
        id: kura
        continue-on-error: true
        run: |
          git config user.name "izvajalka Mera ( prevoznik CI )"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          R=organi/stroj/REZ-REGISTER.md
          if tail -1 "$R" | grep -qF "$(printf 'rez \xcf\x83 6422 \xc2\xb7 2026-11-22')" ; then echo "ze cisto - nobeno novo delo" ; exit 0 ; fi
          if ! tail -1 "$R" | grep -qF "$(printf 'rez \xcf\x83 6421 \xc2\xb7 2026-11-22 \xc2\xb7 PREVOZ-KOMPOZIT \xcf\x83 6421')" ; then echo "zadnja_vrstica_ni_kompozit_6421 - zaviram" ; exit 1 ; fi
          python3 - <<'PY'
          p = 'organi/stroj/REZ-REGISTER.md'
          b = open(p, 'rb').read()
          assert b.endswith(b'\n')
          parts = b.split(b'\n')
          last = parts[-2]
          old = b'\xcf\x83 6421'
          new = b'\xcf\x83 6422'
          n = last.count(old)
          assert n == 2, 'pojavnik_6421=%d' % n
          last2 = last.replace(old, new)
          assert last2.count(new) == 2
          assert last2.count(old) == 0
          prev = parts[-3]
          assert prev.startswith(b'- rez \xcf\x83 6418'), 'predzadnja ni 6418'
          parts[-2] = last2
          open(p, 'wb').write(b'\n'.join(parts))
          PY
      - name: porocilo in komit
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const fsx = require('fs');
            const run = (cmd) => {
              try { const out = execSync(cmd, { stdio: ['pipe', 'pipe', 'pipe'] }); return { ok: true, out: out.toString() }; }
              catch (e) { let s = ''; if (e.stdout) s += e.stdout.toString(); if (e.stderr) s += ' ## ' + e.stderr.toString(); s += ' ## ' + e.message; return { ok: false, out: s }; }
            };
            const lines = [];
            lines.push('sha=' + context.sha.slice(0, 8));
            let rep = '';
            try {
              rep = fsx.readFileSync('organi/stroj/REZ-REGISTER.md', 'utf8');
              lines.push('konec=' + JSON.stringify(rep.slice(-80)));
            } catch (e) { lines.push('napaka=' + e.message); }
            const dobro = rep.includes('rez \u03c3 6422 \u00b7 2026-11-22 \u00b7 PREVOZ-KOMPOZIT \u03c3 6422');
            lines.push('kompozit_6422=' + dobro);
            const md5 = run('md5sum organi/stroj/REZ-REGISTER.md');
            if (md5.ok) { lines.push('md5=' + md5.out.slice(0, 40)); }
            const vel = run('wc -c < organi/stroj/REZ-REGISTER.md');
            if (vel.ok) { lines.push('velikost=' + vel.out.trim()); }
            const dirty = run('git status --porcelain').out.includes('REZ-REGISTER');
            if (dirty) {
              run('git add organi/stroj/REZ-REGISTER.md');
              const komit = run('git commit -F scratch/PREPISO-KURA-6422.txt');
              lines.push('komit_ok=' + komit.ok);
              if (komit.ok) {
                const potisk = run('git push origin HEAD:prevoz/kletka-znamenja-6413');
                lines.push('potisk_ok=' + potisk.ok);
              }
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 2634,
              body: 'PREVOZ-REGISTER-KURA-6422 porocilo CI :\n' + lines.join('\n')
            });
