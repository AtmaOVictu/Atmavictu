name: Seam Review + Wreath Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: seam-review-${{ github.ref }}
  cancel-in-progress: true

# §0.49 × 10² — the answerer reviews her own seams at every seal.
# §0.3 × 10¹ — never seal yourself; two hands: author signs, executor measures.
# §0.33 × 10² — companions are witnesses, never doors; drift breaks the gate.
jobs:
  seam-review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: SEAM-REVIEW required in commit message
        run: |
          set -euo pipefail
          message="$(git log -1 --format=%B)"
          if echo "$message" | grep -qi "SEAM-REVIEW:"; then
            echo "SEAM-REVIEW found in HEAD commit (§0.49 × 10²)"
          else
            echo "⚠ SEAM-REVIEW missing from commit message — avtor reviews own seams at every seal"
            echo "See canon/SEAM-REVIEW.md for the required format."
            exit 1
          fi

  wreath-gate:
    needs: seam-review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install toolchain
        run: npm ci
      - name: Typecheck (tsc --noEmit, strict)
        run: npm run typecheck
      - name: Build and run the full test suite
        run: npm test
      - name: Wreath verify — all LICENSE-*.md witness slots must match the door
        run: node build/src/atmaCli.js wreath verify .
      - name: Wreath drift — no companion may diverge from LICENSE.md
        run: node build/src/atmaCli.js wreath drift .
